name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  # Render and build only; nothing here writes to the repository.
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-module:
    name: single-module (${{ matrix.combo }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - combo: all-jvm-web
            flags: ""
            tasks: ":composeApp:compileDebugKotlinAndroid :composeApp:compileKotlinJvm :composeApp:compileKotlinJs :composeApp:compileKotlinWasmJs"
            os: ubuntu-latest
          - combo: all-ios
            flags: ""
            tasks: ":composeApp:compileKotlinIosSimulatorArm64"
            os: macos-latest
          - combo: android-desktop
            flags: "--feature ios=false --feature web=false"
            tasks: ":composeApp:compileDebugKotlinAndroid :composeApp:compileKotlinJvm"
            os: ubuntu-latest
          - combo: android-only
            flags: "--feature ios=false --feature web=false --feature desktop=false"
            tasks: ":composeApp:compileDebugKotlinAndroid"
            os: ubuntu-latest
          # One combo with the profile feature off, so a form that stopped
          # compiling without the generated AppConfig cannot hide behind
          # the feature being default-on.
          - combo: no-environments
            flags: "--feature environments=false"
            tasks: ":composeApp:compileDebugKotlinAndroid"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render combo
        run: |
          templetry render --template ./single-module --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app" ${{ matrix.flags }}
          chmod +x "$RUNNER_TEMP/out/App/gradlew"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile rendered output
        working-directory: ${{ runner.temp }}/out/App
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace
      - name: -PappEnv selects the profile (ADR-0018)
        if: matrix.combo == 'android-only'
        working-directory: ${{ runner.temp }}/out/App
        run: |
          # Rebuild under a non-default profile and read back what the
          # generated common object actually says. Only one combo runs
          # this: the generation is target-agnostic by construction, so
          # repeating it per platform would buy nothing.
          ./gradlew :composeApp:compileDebugKotlinAndroid -PappEnv=staging --no-daemon
          generated=$(find composeApp/build/generated/templetry -name AppConfig.kt)
          if [ -z "$generated" ]; then
            echo "::error::no AppConfig.kt was generated"; exit 1
          fi
          grep -q 'ENVIRONMENT: String = "staging"' "$generated" || {
            echo "::error::-PappEnv=staging did not reach the generated AppConfig"
            cat "$generated"; exit 1
          }

  modular-features:
    name: modular-features (${{ matrix.combo }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - combo: default
            flags: ""
            tasks: ":composeApp:compileDebugKotlinAndroid :composeApp:compileKotlinDesktop"
            os: ubuntu-latest
          - combo: default-ios
            flags: ""
            tasks: ":composeApp:compileKotlinIosSimulatorArm64"
            os: macos-latest
          - combo: android-desktop
            flags: "--feature ios=false"
            tasks: ":composeApp:compileDebugKotlinAndroid :composeApp:compileKotlinDesktop"
            os: ubuntu-latest
          - combo: android-only
            flags: "--feature ios=false --feature desktop=false"
            tasks: ":composeApp:compileDebugKotlinAndroid"
            os: ubuntu-latest
          # One combo with the profile feature off, so a form that stopped
          # compiling without the generated AppConfig cannot hide behind
          # the feature being default-on.
          - combo: no-environments
            flags: "--feature environments=false"
            tasks: ":composeApp:compileDebugKotlinAndroid"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./modular-features --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app" ${{ matrix.flags }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile rendered output
        working-directory: ${{ runner.temp }}/out
        run: gradle ${{ matrix.tasks }} --no-daemon --stacktrace

  modular-ui:
    name: modular-ui (${{ matrix.combo }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - combo: default
            flags: ""
            tasks: ":composeApp:compileDebugKotlinAndroid :composeApp:compileKotlinDesktop"
            os: ubuntu-latest
          - combo: default-ios
            flags: ""
            tasks: ":composeApp:compileKotlinIosSimulatorArm64"
            os: macos-latest
          - combo: android-desktop
            flags: "--feature ios=false"
            tasks: ":composeApp:compileDebugKotlinAndroid :composeApp:compileKotlinDesktop"
            os: ubuntu-latest
          - combo: android-only
            flags: "--feature ios=false --feature desktop=false"
            tasks: ":composeApp:compileDebugKotlinAndroid"
            os: ubuntu-latest
          # One combo with the profile feature off, so a form that stopped
          # compiling without the generated AppConfig cannot hide behind
          # the feature being default-on.
          - combo: no-environments
            flags: "--feature environments=false"
            tasks: ":composeApp:compileDebugKotlinAndroid"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./modular-ui --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app" ${{ matrix.flags }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile rendered output
        working-directory: ${{ runner.temp }}/out
        run: gradle ${{ matrix.tasks }} --no-daemon --stacktrace

  library:
    name: library (${{ matrix.combo }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - combo: default
            flags: ""
            tasks: "build"
            os: ubuntu-latest
          - combo: default-ios
            flags: ""
            tasks: ":compileKotlinIosSimulatorArm64"
            os: macos-latest
          - combo: jvm-only
            flags: "--feature android=false --feature ios=false"
            tasks: "build"
            os: ubuntu-latest
          - combo: no-serialization
            flags: "--feature serialization=false"
            tasks: "build"
            os: ubuntu-latest
          # With the profile feature off there is no generated BuildProfile, so a
          # form that quietly started depending on it cannot hide behind the
          # feature being default-on.
          - combo: no-environments
            flags: "--feature environments=false"
            tasks: "build"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./library --out "$RUNNER_TEMP/out"             --set "project_name=Verify Lib" --set "base_package=com.verify.lib" ${{ matrix.flags }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile rendered output
        working-directory: ${{ runner.temp }}/out
        run: gradle ${{ matrix.tasks }} --no-daemon --stacktrace
      - name: -PlibEnv selects the profile (ADR-0018)
        if: matrix.combo == 'jvm-only'
        working-directory: ${{ runner.temp }}/out
        run: |
          gradle :compileKotlinJvm -PlibEnv=staging --no-daemon
          generated=$(find build/generated/templetry -name BuildProfile.kt)
          if [ -z "$generated" ]; then
            echo "::error::no BuildProfile.kt was generated"; exit 1
          fi
          grep -q 'ENVIRONMENT: String = "staging"' "$generated" || {
            echo "::error::-PlibEnv=staging did not reach the generated BuildProfile"
            cat "$generated"; exit 1
          }

  # The commands AGENTS.md hands to an agent have to be the ones this form is
  # verified with. Drift here is silent: the wrong command just runs.
  agents:
    name: AGENTS.md matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/check-agents@main
