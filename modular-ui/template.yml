schema_version: 1
name: kmp-modular-ui
description: KMP multi-module base — Android + Desktop + iOS, core/data/domain layers with a single unified ui module
kinds: [multiplatform, android, ios, desktop]
languages: [kotlin]
frameworks: [compose-multiplatform]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: base_package
    label: Base package
    type: string
    pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"

features:
  - key: environments
    label: development / staging / production profiles (ADR-0018)
    default: true
    files:
      - "composeApp/src/commonMain/kotlin/dev/template/kmpbase/config/**"
  - key: ios
    label: iOS target
    default: true
    files: ["**/src/iosMain/**", "iosApp/**"]
  - key: desktop
    label: Desktop (JVM) target
    default: true
    files: ["**/src/desktopMain/**"]

identity:
  - from: "dev.template.kmpbase"
    to: "{base_package}"
  - from: "KMP Native Base"  # human-readable app label (strings.xml)
    to: "{project_name}"
  - from: "KMPNativeBase"
    to: "{project_name.pascal}"
  - from: "kmpbase"          # plugin-id namespace, desktop storage dirs
    to: "{project_name.flat}"
