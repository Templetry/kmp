schema_version: 1
name: kmp-single-module
description: KMP single-module starter — Android, iOS, Desktop and Web/Wasm from one codebase
kinds: [multiplatform, android, ios, desktop, frontend]
languages: [kotlin]
frameworks: [compose-multiplatform]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"
  - key: base_package
    label: Base package
    type: string
    pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"

features:
  - key: environments
    label: development / staging / production profiles (ADR-0018)
    default: true
    files:
      - "App/composeApp/src/commonMain/kotlin/es/sebas1705/axiomnode/config/**"
  - key: ios
    label: iOS target
    default: true
    files: ["App/composeApp/src/iosMain/**"]
  - key: desktop
    label: Desktop (JVM) target
    default: true
    files: ["App/composeApp/src/jvmMain/**"]
  - key: web
    label: Web target (JS + Wasm)
    default: true
    files:
      - "App/composeApp/src/jsMain/**"
      - "App/composeApp/src/wasmJsMain/**"
      - "App/composeApp/src/webMain/**"

identity:
  - from: "es.sebas1705.axiomnode"   # full app package (also renames dirs)
    to: "{base_package}"
  - from: "MultiplatformModApp"      # repo name in docs
    to: "{project_name.pascal}"
  - from: "es.sebas1705"             # group prefix without app suffix
    to: "{base_package}"
  - from: "AxiomNode"                # rootProject.name and class names
    to: "{project_name.pascal}"
  - from: "axiomnode"                # bare tokens (bundle ids, dirs)
    to: "{project_name.flat}"
