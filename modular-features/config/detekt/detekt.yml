build:
  maxIssues: 0

# Detekt's defaults skip test sources for some rules, but its list of test directories predates
# the Android KMP library plugin, whose JVM tests of Android code live in src/androidHostTest.
testExcludes: &testExcludes
  - "**/test/**"
  - "**/androidTest/**"
  - "**/commonTest/**"
  - "**/jvmTest/**"
  - "**/desktopTest/**"
  - "**/androidUnitTest/**"
  - "**/androidHostTest/**"
  - "**/androidInstrumentedTest/**"
  - "**/androidDeviceTest/**"
  - "**/iosTest/**"

config:
  validation: true
  # testExcludes above is an anchor, not a rule set.
  excludes: "testExcludes"
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  CommentOverPrivateFunction: { active: false }
  CommentOverPrivateProperty: { active: false }
  UndocumentedPublicClass: { active: false }
  UndocumentedPublicFunction: { active: false }
  UndocumentedPublicProperty: { active: false }

complexity:
  active: true
  CyclomaticComplexMethod: { active: true, threshold: 15, excludes: *testExcludes }
  LongMethod: { active: true, threshold: 60, excludes: *testExcludes }
  LongParameterList: { active: true, functionThreshold: 8, constructorThreshold: 8, excludes: *testExcludes }
  TooManyFunctions: { active: true, thresholdInFiles: 20, thresholdInClasses: 15, excludes: *testExcludes }

coroutines:
  active: true
  GlobalCoroutineUsage: { active: true }
  RedundantSuspendModifier: { active: true }
  SuspendFunWithCoroutineScopeReceiver: { active: true }

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught: { active: true }
  TooGenericExceptionThrown: { active: true }

formatting:
  active: true
  android: true
  autoCorrect: true
  AnnotationOnSeparateLine: { active: false }
  EnumEntryNameCase: { active: false }
  ImportOrdering: { active: false }
  MaximumLineLength: { active: true, maxLineLength: 140 }
  NoWildcardImports: { active: false }
  TrailingCommaOnCallSite: { active: false }
  TrailingCommaOnDeclarationSite: { active: false }

naming:
  active: true
  FunctionNaming: { active: true, ignoreAnnotated: ["Composable"] }
  InvalidPackageDeclaration: { active: false }
  NoNameShadowing: { active: true }
  TopLevelPropertyNaming: { active: true }
  VariableNaming: { active: true }

performance:
  active: true
  ArrayPrimitive: { active: true }
  ForEachOnRange: { active: true }
  SpreadOperator: { active: true }

potential-bugs:
  active: true
  AvoidReferentialEquality: { active: true }
  DontDowncastCollectionTypes: { active: true }
  EqualsAlwaysReturnsTrueOrFalse: { active: true }
  LateinitUsage: { active: false }
  NullableToStringCall: { active: true }
  UnreachableCode: { active: true }
  UnsafeCallOnNullableType: { active: true, excludes: *testExcludes }
  UnsafeCast: { active: true }

style:
  active: true
  ForbiddenComment: { active: true, comments: ["FIXME:", "STOPSHIP:"], allowedPatterns: "" }
  MagicNumber: { active: true, ignoreAnnotated: ["Composable"], ignoreNumbers: ["-1", "0", "1", "2", "100", "1000"], excludes: *testExcludes }
  MaxLineLength: { active: true, maxLineLength: 140, excludeImportStatements: true }
  ReturnCount: { active: true, max: 4 }
  UnusedImports: { active: true }
  WildcardImport: { active: false }
